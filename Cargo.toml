[package]
name = "makepad-html"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Reusable native HTML/CSS rendering and widgets for Makepad"
repository = "https://github.com/OctoSense-org/makepad-html"
readme = "README.md"

[workspace]
members = [".", "vendor/blitz/packages/*"]
default-members = ["."]
resolver = "2"

[features]
default = ["system-fonts"]
system-fonts = ["blitz-dom/system-fonts"]
makepad = ["dep:makepad-widgets"]
# Raw-engine regression tests only; does not relax production HTML admission.
test-svg = ["blitz-paint/svg"]

[dependencies]
blitz-dom = { path = "vendor/blitz/packages/blitz-dom", default-features = false, features = ["complex-scripts"] }
blitz-html = { path = "vendor/blitz/packages/blitz-html", default-features = false }
blitz-paint = { path = "vendor/blitz/packages/blitz-paint", default-features = false }
blitz-traits = { path = "vendor/blitz/packages/blitz-traits", default-features = false }
anyrender = "=0.13.0"
anyrender_vello_cpu = "=0.17.0"
peniko = "=0.6.1"
html5ever = "=0.39.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"

makepad-widgets = { git = "https://github.com/kevinaboos/makepad", branch = "button-grab-key-focus", features = ["serde"], optional = true }

[[example]]
name = "viewer"
required-features = ["makepad"]

[dev-dependencies]
png = "0.18"
serde_json = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0

# Pinned upstream workspace metadata for the six vendored renderer crates.
[workspace.package]
version = "0.3.0-beta.2"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[workspace.dependencies]
# Blitz dependencies(in-repo)
blitz-dom = { version = "=0.3.0-beta.2", path = "vendor/blitz/packages/blitz-dom", default-features = false }
blitz-html = { version = "=0.3.0-beta.2", path = "vendor/blitz/packages/blitz-html", default-features = false }
blitz-paint = { version = "=0.3.0-beta.2", path = "vendor/blitz/packages/blitz-paint", default-features = false }
blitz-traits = { version = "=0.3.0-beta.2", path = "vendor/blitz/packages/blitz-traits", default-features = false }
stylo_taffy = { version = "=0.3.0-beta.2", path = "vendor/blitz/packages/stylo_taffy", default-features = false }
debug_timer = { version = "0.1.2", path = "vendor/blitz/packages/debug_timer" }

# Servo dependencies
style = { version = "0.21.0", package = "stylo" }
style_traits = { version = "0.21.0", package = "stylo_traits" }
style_atoms = { version = "0.21.0", package = "stylo_atoms" }
style_config = { version = "0.21.0", package = "stylo_static_prefs" }
style_dom = { version = "0.21.0", package = "stylo_dom" }
selectors = { version = "0.40.0", package = "selectors" }
cssparser = { version = "0.37.0" }

# HTML5ever dependencies
markup5ever = "0.39.0" # needs to match stylo web_atoms version
html5ever = "0.39.0"   # needs to match stylo web_atoms version
xml5ever = "0.39.0"    # needs to match stylo web_atoms version

# Other Servo dependencies
euclid = "0.22"
atomic_refcell = "0.1.13"
app_units = "0.7.5"
smallvec = "1"
thin-vec = "0.2"

# DioxusLabs dependencies
dioxus = { version = "0.7.3" }
dioxus-core = { version = "0.7.3" }
dioxus-html = { version = "0.7.3" }
dioxus-hooks = { version = "0.7.3" }
dioxus-signals = { version = "0.7.3" }
dioxus-stores = { version = "0.7.3" }
dioxus-asset-resolver = { version = "0.7.3" }
manganis = { version = "0.7.3" }
dioxus-document = { version = "0.7.3" }
dioxus-history = { version = "0.7.3" }

# Dioxus hot reload
dioxus-devtools = { version = "0.7.3" }
dioxus-cli-config = { version = "0.7.3" }

# Dioxus Prelude
dioxus-core-macro = { version = "0.7.3" }

# Taffy + Parley + Fontations
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4863877b9cab21645b160d7f247901f90214fe27", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }
parley = { version = "0.11.1", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = [
    "std",
] } # Should match parley and vello versions

# AnyRender
anyrender = { version = "0.13.0" }
anyrender_serialize = { version = "0.7.0" }
anyrender_skia = { version = "0.11.0" }
anyrender_vello = { version = "0.14.0" }
anyrender_vello_cpu = { version = "0.17.0" }
anyrender_vello_hybrid = { version = "0.10.0" }
anyrender_svg = { version = "0.14.0" }
wgpu_context = { version = "0.9.0" }

# Linebender + Fontations + WGPU + SVG
color = "0.3"
linebender_resource_handle = "0.1"
peniko = "0.6.0"
kurbo = "0.13.1"
wgpu = "29"
usvg = "0.48.1"
svgtypes = "0.16.1" # Should match usvg's version

# Windowing & Input
raw-window-handle = "0.6.0"
winit = { version = "=0.31.0-beta.3" }
accesskit = "0.25"
arboard = { version = "3.4.1", default-features = false }
rfd = { version = "0.17.1", default-features = false }
keyboard-types = "0.7"
cursor-icon = "1"

# IO & Networking
url = "2.5.0"
http = "1.1.0"
data-url = "0.3.1"
tokio = "1.42"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5.1", default-features = false }
http-cache-reqwest = { version = "=1.0.0-alpha.6", default-features = false }
http-cache = { version = "=1.0.0-alpha.6", default-features = false }

# Media & Decoding
image = { version = "0.25.6", default-features = false }
wuff = "0.2"
html-escape = "0.2.13"
percent-encoding = "2.3.1"
png = "0.18"
serde = "1"

# Dioxus Native
webbrowser = "1.0"
directories = "6.0.0"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tracing-wasm = "0.2.1"
web-sys = "0.3.98"
web-time = "1"
console_error_panic_hook = "0.1"

# JavaScript engine (Boa)
boa_engine = "0.22"
boa_runtime = "0.22"
boa_gc = "0.22"

# Other dependencies
rustc-hash = "2.1.2"
bytes = "1.7.1"
slotmap = "1.0.7"
tracing = "0.1.40"
tracing-subscriber = "0.3"
futures-util = "0.3.30"
futures-intrusive = "0.5.0"
pollster = "0.4"
smol_str = "0.3"
bitflags = "2.8.0"
bytemuck = "1"
rayon = "1"
test-that = "0.5.2"
thread_local = "1"
